name: TestFlight

on:
  workflow_dispatch:
    inputs:
      app:
        description: App Store Connect record to upload to
        type: choice
        options: [dev, release]
        default: dev
  # Pushing a commit whose message starts with [testflight] also uploads a
  # build (always to the dev app), for tools that can push but cannot start
  # workflows by hand. Only the start counts: the marker quoted in a message
  # body, or in the commit list of a squash merge, must not upload.
  push:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  upload:
    name: Archive and upload
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[testflight]')
    concurrency:
      group: testflight
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM || secrets.DEVELOPMENT_TEAM }}
      APP_TARGET: ${{ inputs.app || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      # Development builds go to a separate App Store Connect record: the
      # release record (com.camerac64) is removed from sale, and TestFlight
      # cannot install builds of an app in that state.
      # Build numbers must be higher than every earlier upload to a record, and
      # the release record's last one (2018) was 20180325001. Both records
      # continue that scheme: the UTC date, then the run number.
      - name: Choose the app and build number
        run: |
          case "$APP_TARGET" in
            dev) bundle_id=com.camerac64.dev; display_name="C64 Dev" ;;
            release) bundle_id=com.camerac64; display_name="Camera C64" ;;
            *) echo "::error::Unknown app '$APP_TARGET'"; exit 1 ;;
          esac
          {
            echo "APP_BUNDLE_ID=$bundle_id"
            echo "APP_DISPLAY_NAME=$display_name"
            echo "BUILD_NUMBER=$(date -u +%Y%m%d)$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          } >> "$GITHUB_ENV"

      - name: Check the signing settings
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=()
          [ -n "$ASC_KEY_ID" ] || missing+=("secret ASC_KEY_ID")
          [ -n "$ASC_ISSUER_ID" ] || missing+=("secret ASC_ISSUER_ID")
          [ -n "$ASC_KEY_P8" ] || missing+=("secret ASC_KEY_P8")
          [ -n "$DEVELOPMENT_TEAM" ] || missing+=("variable or secret DEVELOPMENT_TEAM")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing ${missing[*]} (see docs/CI.md)"
            exit 1
          fi
          echo "Uploading $APP_BUNDLE_ID for team $DEVELOPMENT_TEAM, build number $BUILD_NUMBER"

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # The archive is left unsigned: signing it would make Xcode mint a new
      # development certificate through the API key on every run. All signing
      # happens at export, through Apple's cloud-managed distribution signing.
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project CameraC64.xcodeproj \
            -scheme CameraC64 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CameraC64.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            INFOPLIST_KEY_CFBundleDisplayName="$APP_DISPLAY_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
          plist="$RUNNER_TEMP/CameraC64.xcarchive/Products/Applications/CameraC64.app/Info.plist"
          for key in CFBundleIdentifier CFBundleDisplayName CFBundleShortVersionString CFBundleVersion \
              ITSAppUsesNonExemptEncryption; do
            echo "$key: $(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>&1)"
          done

      # Cloud signing needs an API key with the Admin role. With
      # destination=upload, this step signs and sends the build; its exit
      # status says whether App Store Connect accepted it.
      - name: Sign and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CameraC64.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
