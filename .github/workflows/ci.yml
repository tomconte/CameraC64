name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core:
    name: C64Core and tools (Linux)
    # Pull requests from this repository are already covered by their push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Keep in step with .claude/hooks/session-start.sh and the Swift in Xcode.
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: swift format lint --strict --recursive Packages App Tools
      - name: Check the assembled display programs
        run: |
          apt-get update -qq
          apt-get install -y -qq cc65 >/dev/null
          generated=Packages/C64Core/Sources/C64Core/DisplayPrograms.swift
          cp "$generated" /tmp/DisplayPrograms.swift
          C64/build.sh
          if ! diff -u /tmp/DisplayPrograms.swift "$generated"; then
            echo "::error::$generated is out of date: run C64/build.sh and commit the result"
            exit 1
          fi
      - name: Build
        run: swift build --package-path Packages/C64Core
      - name: Test
        run: swift test --package-path Packages/C64Core
      # The app runs C64Core optimised, and an optimised build once got
      # pictures wrong that a debug build got right.
      - name: Test optimised
        run: swift test -c release -Xswiftc -enable-testing --package-path Packages/C64Core
      - name: Test the tools
        run: swift test --package-path Tools
      # The photos come from a personal website that sometimes refuses
      # requests, so runs keep them.
      - name: Keep the benchmark's photos
        uses: actions/cache@v6
        with:
          path: Tools/Benchmark/photos
          key: benchmark-photos-${{ hashFiles('Tools/Benchmark/photos.txt') }}
      # Converts the photo set and fails if the scores get worse than
      # Tools/Benchmark/scores.txt.
      - name: Quality benchmark
        run: |
          command -v curl >/dev/null || apt-get install -y -qq curl >/dev/null
          Tools/Benchmark/get-photos.sh
          swift run -c release --package-path Tools c64conv benchmark \
            -o "$RUNNER_TEMP/benchmark" --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the benchmark's pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: QualityBenchmark
          path: ${{ runner.temp }}/benchmark
          if-no-files-found: ignore

  vice:
    name: VICE comparison (macOS)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Install VICE
        run: |
          brew install vice
          ls "$(brew --prefix)/share/vice/C64"
      # Runs every exported program in x64sc and compares the screen with the
      # renderer's, pixel for pixel. VICE_REQUIRED makes a missing x64sc fail.
      - name: Compare the renderer with VICE
        env:
          VICE_REQUIRED: "1"
          VICE_TEST_OUTPUT: ${{ runner.temp }}/vice
        run: swift test --package-path Tools
      - name: Keep the screens that differ
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: VICEScreens
          path: ${{ runner.temp }}/vice
          if-no-files-found: ignore
      - name: Keep the benchmark's photos
        uses: actions/cache@v6
        with:
          path: Tools/Benchmark/photos
          key: benchmark-photos-${{ hashFiles('Tools/Benchmark/photos.txt') }}
      # image64 (github.com/nschneir/image64, MIT) is the benchmark's baseline
      # for the bitmap modes. It only builds on macOS. Its scores are for
      # comparison: the Linux job checks ours.
      - name: Compare the benchmark with image64
        continue-on-error: true
        run: |
          git clone -q https://github.com/nschneir/image64.git "$RUNNER_TEMP/image64"
          git -C "$RUNNER_TEMP/image64" checkout -q a7568a455bd0318116474135e6c746a3b3c77b5d
          swift build -c release --package-path "$RUNNER_TEMP/image64" --product image64
          Tools/Benchmark/get-photos.sh
          IMAGE64="$RUNNER_TEMP/image64/.build/release/image64" \
            swift run -c release --package-path Tools c64conv benchmark --summary "$GITHUB_STEP_SUMMARY"

  app:
    name: App (iOS)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test on the iOS Simulator
        run: |
          xcodebuild test \
            -project CameraC64.xcodeproj \
            -scheme CameraC64 \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17' \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
      - name: Build for device (unsigned)
        run: |
          xcodebuild archive \
            -project CameraC64.xcodeproj \
            -scheme CameraC64 \
            -destination 'generic/platform=iOS' \
            -archivePath build/CameraC64.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: ignore
