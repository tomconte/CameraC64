<?xml version="1.0" encoding="UTF-8"?>
<!-- Each SVG feature the skin's images use, with a known colour at a known point, so that SkinTests can
     check that iOS draws them all as the design's editors do. 1 unit = 1 point. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="60" viewBox="0 0 100 60">
  <defs>
    <linearGradient id="across" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" />
      <stop offset="1" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF0000" />
      <stop offset="1" stop-color="#0000FF" />
    </linearGradient>
    <radialGradient id="dome" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00FF00" />
      <stop offset="1" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="downInBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF0000" />
      <stop offset="1" stop-color="#0000FF" />
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="1" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <clipPath id="disc">
      <circle cx="20" cy="40" r="15" />
    </clipPath>
  </defs>
  <rect width="100" height="60" fill="#FFFFFF" />
  <!-- At (10, 10), half way across a gradient in its shape's own units: grey. -->
  <rect x="0" y="0" width="20" height="20" fill="url(#across)" />
  <!-- At (50, 10), the middle of a radial gradient: green. -->
  <circle cx="50" cy="10" r="10" fill="url(#dome)" />
  <!-- At (70, 10), black at half opacity, on a rounded rectangle: grey. -->
  <rect x="60" y="0" width="20" height="20" rx="4" fill="#000000" fill-opacity="0.5" />
  <!-- At (84, 30), the stroke round a rounded rectangle, painted with a gradient in the drawing's units, half
       way down: purple. -->
  <rect x="84" y="22" width="12" height="16" rx="3" stroke="url(#down)" stroke-width="4" fill="none" />
  <!-- At (62, 30), the stroke round a rectangle, painted with a gradient in its shape's units, half way down:
       purple. -->
  <rect x="62" y="24" width="14" height="12" stroke="url(#downInBox)" stroke-width="4" fill="none" />
  <!-- In a disc, a frame with a hole in it, by the even-odd rule: red at (8, 40), white in the hole at
       (20, 40), and white outside the disc at (2, 40). -->
  <g clip-path="url(#disc)">
    <path d="M0 20 H40 V60 H0 Z M14 34 H26 V46 H14 Z" fill-rule="evenodd" fill="#FF0000" />
  </g>
  <!-- At (55, 45), a square moved and scaled: blue. -->
  <g transform="translate(50 40) scale(2)">
    <rect x="0" y="0" width="5" height="5" fill="#0000FF" />
  </g>
  <!-- At (78, 50), the round cap of a line that ends at 76: green. -->
  <path d="M66 50 H76" stroke="#00FF00" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- At (90, 50), half way along a gradient that fades out: grey. -->
  <rect x="80" y="40" width="20" height="20" fill="url(#fade)" />
  <!-- At (20, 8) and (30, 8), arcs and curves: an orange disc drawn with two arcs, and a curve's hump. -->
  <path d="M16 8 A4 4 0 0 1 24 8 A4 4 0 0 1 16 8 Z" fill="#FF8000" />
  <path d="M26 14 Q30 2 34 14 Z" fill="#FF8000" />
</svg>
