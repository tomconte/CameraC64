<?xml version="1.0" encoding="UTF-8"?>
<!-- A monitor's lamp, lit, 10 points across. 1 unit = 1 point. No filters: every effect is an ordinary shape. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="22" height="22" viewBox="0 0 22 22">
  <defs>
    <radialGradient id="led-dome-off" cx="0.5" cy="0.72" r="0.65">
      <stop offset="0" stop-color="#B86400"/>
      <stop offset="0.55" stop-color="#7E4400"/>
      <stop offset="1" stop-color="#4A2800"/>
    </radialGradient>
    <radialGradient id="led-dome-on" cx="0.42" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#FFFFA8"/>
      <stop offset="0.3" stop-color="#FFF000"/>
      <stop offset="0.65" stop-color="#FFB000"/>
      <stop offset="1" stop-color="#E57A00"/>
    </radialGradient>
    <radialGradient id="led-halo-on" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC21A" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#FFB000" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFA000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="backdrop" inkscape:groupmode="layer" inkscape:label="Panneau (référence, à masquer)">
    <rect x="0" y="0" width="22" height="22" rx="0" fill="#CBBFA6"/>
  </g>
  <g id="lamp" inkscape:groupmode="layer" inkscape:label="Voyant">
    <g id="led" inkscape:label="Voyant allumé">
      <g id="led-halo" inkscape:label="Halo">
        <circle cx="11" cy="11" r="10.5" fill="url(#led-halo-on)"/>
      </g>
      <g id="led-lip" inkscape:label="Lèvre sous le voyant">
        <circle cx="11" cy="11.6" r="5.7" fill="#EDE6D9" fill-opacity="0.8"/>
      </g>
      <g id="led-socket" inkscape:label="Douille">
        <circle cx="11" cy="11" r="5.7" fill="#C08A3A"/>
      </g>
      <g id="led-dome" inkscape:label="Dôme">
        <circle cx="11" cy="11" r="5" fill="url(#led-dome-on)"/>
      </g>
      <g id="led-highlight" inkscape:label="Reflet">
        <ellipse cx="9.625" cy="9.125" rx="1.875" ry="1.125" fill="#FFFFFF" fill-opacity="0.55"/>
      </g>
    </g>
  </g>
</svg>
