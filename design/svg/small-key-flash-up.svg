<?xml version="1.0" encoding="UTF-8"?>
<!-- A small key, up, 34 by 42 points: flash, beside the TV in landscape. 1 unit = 1 point. No filters: every effect is an ordinary shape. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="42" height="52" viewBox="0 0 42 52">
  <defs>
    <linearGradient id="key-edge-up" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A08D6D"/>
      <stop offset="1" stop-color="#7E6A4B"/>
    </linearGradient>
    <linearGradient id="key-face-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8BBA2"/>
      <stop offset="0.3" stop-color="#D3C8B4"/>
      <stop offset="1" stop-color="#DFD7C8"/>
    </linearGradient>
    <linearGradient id="key-rim-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="key-edge-down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#85704D"/>
      <stop offset="1" stop-color="#9E8B67"/>
    </linearGradient>
    <linearGradient id="key-face-down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BBA98B"/>
      <stop offset="0.35" stop-color="#CDBFA7"/>
      <stop offset="1" stop-color="#DBD0BD"/>
    </linearGradient>
    <linearGradient id="key-shade-down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B4528" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#5B4528" stop-opacity="0"/>
      <stop offset="1" stop-color="#5B4528" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="led-dome-off" cx="0.5" cy="0.72" r="0.65">
      <stop offset="0" stop-color="#B86400"/>
      <stop offset="0.55" stop-color="#7E4400"/>
      <stop offset="1" stop-color="#4A2800"/>
    </radialGradient>
    <radialGradient id="led-dome-on" cx="0.42" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#FFFFA8"/>
      <stop offset="0.3" stop-color="#FFF000"/>
      <stop offset="0.65" stop-color="#FFB000"/>
      <stop offset="1" stop-color="#E57A00"/>
    </radialGradient>
    <radialGradient id="led-halo-on" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC21A" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#FFB000" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFA000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="backdrop" inkscape:groupmode="layer" inkscape:label="Boîtier (référence, à masquer)">
    <rect x="0" y="0" width="42" height="52" rx="0" fill="#D3C7AF"/>
  </g>
  <g id="key" inkscape:groupmode="layer" inkscape:label="Touche">
    <g id="key-body" inkscape:label="Touche">
      <g id="key-body-shadow" inkscape:label="Ombre portée">
        <rect x="3.4" y="3.92" width="36.4" height="45" rx="9.2" fill="#3A2A18" fill-opacity="0.12"/>
        <rect x="3.2" y="3.84" width="36.8" height="45.4" rx="9.4" fill="#3A2A18" fill-opacity="0.12"/>
        <rect x="3" y="3.76" width="37.2" height="45.8" rx="9.6" fill="#3A2A18" fill-opacity="0.12"/>
      </g>
      <g id="key-body-edge" inkscape:label="Bord">
        <rect x="3" y="3" width="36" height="44.6" rx="9" fill="url(#key-edge-up)"/>
      </g>
      <g id="key-body-face" inkscape:label="Face">
        <rect x="4" y="4" width="34" height="42" rx="8" fill="url(#key-face-up)"/>
      </g>
      <g id="key-body-rim" inkscape:label="Reflet">
        <rect x="4.4" y="4.4" width="33.2" height="41.2" rx="7.6" fill="none" stroke="url(#key-rim-up)" stroke-width="0.8"/>
      </g>
    </g>
  </g>
  <g id="icon" inkscape:groupmode="layer" inkscape:label="Icône gravée" transform="translate(21 20) scale(0.9)">
    <g id="icon-light" inkscape:label="Lumière sous la gravure">
      <path d="M2.5 -8.5 L-4.5 1.5 H2 L-2.5 8.5" stroke="#FBF8F2" stroke-width="2.6" transform="translate(0 0.6)" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="icon-shadow" inkscape:label="Ombre de la gravure">
      <path d="M2.5 -8.5 L-4.5 1.5 H2 L-2.5 8.5" stroke="#857358" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="icon-groove" inkscape:label="Gravure">
      <path d="M2.5 -8.5 L-4.5 1.5 H2 L-2.5 8.5" stroke="#B9AB8F" stroke-width="1.8" transform="translate(0 0.4)" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g id="lamp" inkscape:groupmode="layer" inkscape:label="Voyant (posé par le code)">
    <g id="lamp-led" inkscape:label="Voyant éteint">
      <g id="lamp-led-lip" inkscape:label="Lèvre sous le voyant">
        <circle cx="21" cy="38.6" r="3.7" fill="#EDE6D9" fill-opacity="0.8"/>
      </g>
      <g id="lamp-led-socket" inkscape:label="Douille">
        <circle cx="21" cy="38" r="3.7" fill="#3E2408"/>
      </g>
      <g id="lamp-led-dome" inkscape:label="Dôme">
        <circle cx="21" cy="38" r="3" fill="url(#led-dome-off)"/>
      </g>
      <g id="lamp-led-highlight" inkscape:label="Reflet">
        <ellipse cx="20.175" cy="36.875" rx="1.125" ry="0.675" fill="#FFFFFF" fill-opacity="0.28"/>
      </g>
    </g>
  </g>
</svg>
