<?xml version="1.0" encoding="UTF-8"?>
<!-- A monitor key in landscape, pressed, 54 by 44 points: the app writes its lamp and name on it. 1 unit = 1 point. No filters: every effect is an ordinary shape. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="62" height="54" viewBox="0 0 62 54">
  <defs>
    <linearGradient id="key-edge-up" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A08D6D"/>
      <stop offset="1" stop-color="#7E6A4B"/>
    </linearGradient>
    <linearGradient id="key-face-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8BBA2"/>
      <stop offset="0.3" stop-color="#D3C8B4"/>
      <stop offset="1" stop-color="#DFD7C8"/>
    </linearGradient>
    <linearGradient id="key-rim-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="key-edge-down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#85704D"/>
      <stop offset="1" stop-color="#9E8B67"/>
    </linearGradient>
    <linearGradient id="key-face-down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BBA98B"/>
      <stop offset="0.35" stop-color="#CDBFA7"/>
      <stop offset="1" stop-color="#DBD0BD"/>
    </linearGradient>
    <linearGradient id="key-shade-down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B4528" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#5B4528" stop-opacity="0"/>
      <stop offset="1" stop-color="#5B4528" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g id="backdrop" inkscape:groupmode="layer" inkscape:label="Boîtier (référence, à masquer)">
    <rect x="0" y="0" width="62" height="54" rx="0" fill="#D3C7AF"/>
  </g>
  <g id="key" inkscape:groupmode="layer" inkscape:label="Touche">
    <g id="key-body" inkscape:label="Touche enfoncée">
      <g id="key-body-edge" inkscape:label="Bord">
        <rect x="3" y="3" width="56" height="46.2" rx="7" fill="url(#key-edge-down)"/>
      </g>
      <g id="key-body-face" inkscape:label="Face">
        <rect x="4" y="4.4" width="54" height="44" rx="6" fill="url(#key-face-down)"/>
      </g>
      <g id="key-body-shade" inkscape:label="Ombre sur la face">
        <rect x="4.5" y="4.9" width="53" height="43" rx="5.5" fill="none" stroke="url(#key-shade-down)" stroke-width="1.2"/>
      </g>
    </g>
  </g>
</svg>
