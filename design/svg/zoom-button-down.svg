<?xml version="1.0" encoding="UTF-8"?>
<!-- A zoom button, pressed, on the TV's border. 1 unit = 1 point. No filters: every effect is an ordinary shape. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="zoom-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151413"/>
      <stop offset="1" stop-color="#2A2723"/>
    </linearGradient>
    <linearGradient id="zoom-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="0.35" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g id="backdrop" inkscape:groupmode="layer" inkscape:label="Bordure de la télé (référence, à masquer)">
    <rect x="0" y="0" width="40" height="40" rx="0" fill="#1C1B19"/>
  </g>
  <g id="zoom" inkscape:groupmode="layer" inkscape:label="Bouton de zoom enfoncé">
    <g id="zoom-face" inkscape:label="Face">
      <circle cx="20" cy="20.5" r="17" fill="url(#zoom-face)"/>
    </g>
    <g id="zoom-shade" inkscape:label="Ombre sur la face">
      <circle cx="20" cy="20.5" r="16.3" fill="none" stroke="url(#zoom-shade)" stroke-width="1.4"/>
    </g>
  </g>
</svg>
