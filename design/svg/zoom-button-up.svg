<?xml version="1.0" encoding="UTF-8"?>
<!-- A zoom button, up, on the TV's border. 1 unit = 1 point. No filters: every effect is an ordinary shape. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="zoom-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E3A35"/>
      <stop offset="1" stop-color="#1F1D1A"/>
    </linearGradient>
    <linearGradient id="zoom-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A8378" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#8A8378" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8A8378" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g id="backdrop" inkscape:groupmode="layer" inkscape:label="Bordure de la télé (référence, à masquer)">
    <rect x="0" y="0" width="40" height="40" rx="0" fill="#1C1B19"/>
  </g>
  <g id="zoom" inkscape:groupmode="layer" inkscape:label="Bouton de zoom">
    <g id="zoom-shadow" inkscape:label="Ombre portée">
      <circle cx="20.3" cy="21.08" r="17.4" fill="#000000" fill-opacity="0.18"/>
      <circle cx="20.3" cy="21.18" r="17.9" fill="#000000" fill-opacity="0.18"/>
      <circle cx="20.3" cy="21.28" r="18.4" fill="#000000" fill-opacity="0.18"/>
    </g>
    <g id="zoom-face" inkscape:label="Face">
      <circle cx="20" cy="20" r="17" fill="url(#zoom-face)"/>
    </g>
    <g id="zoom-rim" inkscape:label="Reflet">
      <circle cx="20" cy="20" r="16.4" fill="none" stroke="url(#zoom-rim)" stroke-width="0.8"/>
    </g>
  </g>
</svg>
