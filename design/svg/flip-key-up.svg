<?xml version="1.0" encoding="UTF-8"?>
<!-- The key that turns the camera round, up, 56 points square. 1 unit = 1 point. No filters: every effect is an ordinary shape. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="64" height="66" viewBox="0 0 64 66">
  <defs>
    <linearGradient id="key-edge-up" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A08D6D"/>
      <stop offset="1" stop-color="#7E6A4B"/>
    </linearGradient>
    <linearGradient id="key-face-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8BBA2"/>
      <stop offset="0.3" stop-color="#D3C8B4"/>
      <stop offset="1" stop-color="#DFD7C8"/>
    </linearGradient>
    <linearGradient id="key-rim-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="key-edge-down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#85704D"/>
      <stop offset="1" stop-color="#9E8B67"/>
    </linearGradient>
    <linearGradient id="key-face-down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BBA98B"/>
      <stop offset="0.35" stop-color="#CDBFA7"/>
      <stop offset="1" stop-color="#DBD0BD"/>
    </linearGradient>
    <linearGradient id="key-shade-down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B4528" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#5B4528" stop-opacity="0"/>
      <stop offset="1" stop-color="#5B4528" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g id="backdrop" inkscape:groupmode="layer" inkscape:label="Boîtier (référence, à masquer)">
    <rect x="0" y="0" width="64" height="66" rx="0" fill="#D3C7AF"/>
  </g>
  <g id="key" inkscape:groupmode="layer" inkscape:label="Touche">
    <g id="key-body" inkscape:label="Touche">
      <g id="key-body-shadow" inkscape:label="Ombre portée">
        <rect x="3.4" y="3.92" width="58.4" height="59" rx="13.2" fill="#3A2A18" fill-opacity="0.12"/>
        <rect x="3.2" y="3.84" width="58.8" height="59.4" rx="13.4" fill="#3A2A18" fill-opacity="0.12"/>
        <rect x="3" y="3.76" width="59.2" height="59.8" rx="13.6" fill="#3A2A18" fill-opacity="0.12"/>
      </g>
      <g id="key-body-edge" inkscape:label="Bord">
        <rect x="3" y="3" width="58" height="58.6" rx="13" fill="url(#key-edge-up)"/>
      </g>
      <g id="key-body-face" inkscape:label="Face">
        <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#key-face-up)"/>
      </g>
      <g id="key-body-rim" inkscape:label="Reflet">
        <rect x="4.4" y="4.4" width="55.2" height="55.2" rx="11.6" fill="none" stroke="url(#key-rim-up)" stroke-width="0.8"/>
      </g>
    </g>
  </g>
  <g id="icon" inkscape:groupmode="layer" inkscape:label="Icône gravée" transform="translate(32 32) scale(1.35)">
    <g id="icon-light" inkscape:label="Lumière sous la gravure">
      <path d="M-5 -2.5 H-2.5 L-1.5 -4 H1.5 L2.5 -2.5 H5 V4 H-5 Z M1.7 0.7 A1.7 1.7 0 1 1 -1.7 0.7 A1.7 1.7 0 1 1 1.7 0.7 M-8.37 -1.28 A8.5 8.5 0 0 1 6.01 -5.81 M5.75 -8.8 L6.01 -5.81 L3.02 -6.07 M8.37 1.68 A8.5 8.5 0 0 1 -6.01 6.21 M-5.75 9.2 L-6.01 6.21 L-3.02 6.47" stroke="#FBF8F2" stroke-width="1.7" transform="translate(0 0.6)" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="icon-shadow" inkscape:label="Ombre de la gravure">
      <path d="M-5 -2.5 H-2.5 L-1.5 -4 H1.5 L2.5 -2.5 H5 V4 H-5 Z M1.7 0.7 A1.7 1.7 0 1 1 -1.7 0.7 A1.7 1.7 0 1 1 1.7 0.7 M-8.37 -1.28 A8.5 8.5 0 0 1 6.01 -5.81 M5.75 -8.8 L6.01 -5.81 L3.02 -6.07 M8.37 1.68 A8.5 8.5 0 0 1 -6.01 6.21 M-5.75 9.2 L-6.01 6.21 L-3.02 6.47" stroke="#857358" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="icon-groove" inkscape:label="Gravure">
      <path d="M-5 -2.5 H-2.5 L-1.5 -4 H1.5 L2.5 -2.5 H5 V4 H-5 Z M1.7 0.7 A1.7 1.7 0 1 1 -1.7 0.7 A1.7 1.7 0 1 1 1.7 0.7 M-8.37 -1.28 A8.5 8.5 0 0 1 6.01 -5.81 M5.75 -8.8 L6.01 -5.81 L3.02 -6.07 M8.37 1.68 A8.5 8.5 0 0 1 -6.01 6.21 M-5.75 9.2 L-6.01 6.21 L-3.02 6.47" stroke="#B9AB8F" stroke-width="0.9" transform="translate(0 0.4)" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
